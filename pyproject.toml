[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant, built incrementally."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "edge-tts>=6.1.0",
    "pygame>=2.5.0",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.16.0",
    "pydub>=0.25.1",
    "scipy>=1.11.0",
]
google = [
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.126.0",
]
files = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app", "jarvis"]
